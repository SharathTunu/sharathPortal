<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Chat Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --accent:   #7c6aff;
    --accent2:  #ff6ab0;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --user-bg:  #1a1a2e;
    --bot-bg:   #13131d;
    --radius:   16px;
    --chat-w:   420px;
    --chat-h:   560px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* ── Launcher Button ─────────────────────────────── */
  #chat-launcher {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(124,106,255,0.45);
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 1000;
  }
  #chat-launcher:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 40px rgba(124,106,255,0.6);
  }
  #chat-launcher svg { transition: transform 0.3s; }
  #chat-launcher.open svg { transform: rotate(45deg); }

  /* Pulse ring */
  #chat-launcher::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    opacity: 0.3;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50%       { transform: scale(1.3); opacity: 0; }
  }

  /* ── Chat Panel ──────────────────────────────────── */
  #chat-panel {
    position: fixed;
    bottom: 100px;
    right: 28px;
    width: var(--chat-w);
    height: var(--chat-h);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(124,106,255,0.1);
    transform: translateY(20px) scale(0.96);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease;
    z-index: 999;
  }
  #chat-panel.open {
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: all;
  }

  /* Header */
  .chat-header {
    padding: 18px 20px;
    background: linear-gradient(135deg, rgba(124,106,255,0.12), rgba(255,106,176,0.06));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .header-text { flex: 1; }
  .header-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .header-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .message {
    display: flex;
    gap: 8px;
    animation: msgIn 0.3s cubic-bezier(.34,1.4,.64,1) both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }

  .msg-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    margin-top: 2px;
  }
  .message.bot  .msg-icon { background: linear-gradient(135deg,var(--accent),var(--accent2)); }
  .message.user .msg-icon { background: var(--user-bg); border: 1px solid var(--border); }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .message.bot  .bubble { background: var(--bot-bg);  border: 1px solid var(--border); border-top-left-radius: 4px; }
  .message.user .bubble { background: var(--user-bg); border: 1px solid rgba(124,106,255,0.25); border-top-right-radius: 4px; }

  /* Typing indicator */
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 6px 2px; }
  .typing-indicator span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: typing 1.2s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30%            { transform: translateY(-5px); }
  }

  /* Suggestions */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 0 2px;
  }
  .suggestion-chip {
    background: transparent;
    border: 1px solid rgba(124,106,255,0.35);
    color: rgba(124,106,255,0.9);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11.5px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.18s;
  }
  .suggestion-chip:hover {
    background: rgba(124,106,255,0.12);
    border-color: var(--accent);
    color: var(--text);
  }

  /* Input area */
  .chat-input-row {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface);
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    resize: none;
    outline: none;
    line-height: 1.5;
    max-height: 100px;
    transition: border-color 0.2s;
  }
  #user-input::placeholder { color: var(--muted); }
  #user-input:focus { border-color: rgba(124,106,255,0.5); }

  #send-btn {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(1.05); }
  #send-btn:disabled { opacity: 0.35; cursor: default; }

  /* Powered-by strip */
  .powered-by {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    padding: 6px;
    border-top: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  /* Demo preview wrapper */
  .demo-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
  }
  .demo-label {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    #chat-panel {
      right: 0; left: 0; bottom: 0;
      width: 100%; height: 70vh;
      border-radius: 20px 20px 0 0;
    }
    #chat-launcher { bottom: 20px; right: 20px; }
  }
</style>
</head>
<body>

<div class="demo-wrapper">
  <div class="demo-label">↓ Click the button in the bottom-right corner</div>
</div>

<!-- ── Launcher ── -->
<button id="chat-launcher" aria-label="Open chat" onclick="toggleChat()">
  <svg id="launch-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>

<!-- ── Chat Panel ── -->
<div id="chat-panel" role="dialog" aria-label="Portfolio assistant">

  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="header-text">
      <div class="header-name">Alex's Assistant</div>  <!-- ← Change "Alex" -->
      <div class="header-sub">
        <span class="status-dot"></span> Online · Powered by RAG
      </div>
    </div>
  </div>

  <div id="messages">
    <!-- Welcome message rendered by JS -->
  </div>

  <div class="chat-input-row">
    <textarea
      id="user-input"
      rows="1"
      placeholder="Ask me anything about Alex…"
      aria-label="Your message"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div class="powered-by">RAG · OpenAI · Your Portfolio</div>
</div>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const API_URL   = "http://localhost:5000/chat";   // ← Change to your deployed URL
const BOT_NAME  = "Alex's Assistant";             // ← Match your backend

const SUGGESTIONS = [
  "What are your top skills?",
  "Tell me about your work experience",
  "What projects have you built?",
  "How can I contact you?",
];

// ── State ─────────────────────────────────────────────────────────────────────
let isOpen    = false;
let isLoading = false;

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  renderWelcome();
});

function renderWelcome() {
  const container = document.getElementById("messages");
  container.innerHTML = "";

  appendMessage("bot",
    "Hi there! 👋 I'm an AI assistant trained on Alex's resume and bio. " +
    "Ask me anything about their background, skills, or projects."
  );

  // Suggestion chips
  const chipWrap = document.createElement("div");
  chipWrap.className = "message bot";
  const bubbleDiv = document.createElement("div");
  bubbleDiv.className = "bubble";
  const chips = document.createElement("div");
  chips.className = "suggestions";
  SUGGESTIONS.forEach(q => {
    const btn = document.createElement("button");
    btn.className = "suggestion-chip";
    btn.textContent = q;
    btn.onclick = () => { sendText(q); };
    chips.appendChild(btn);
  });
  bubbleDiv.appendChild(chips);
  chipWrap.innerHTML = `<div class="msg-icon">🤖</div>`;
  chipWrap.appendChild(bubbleDiv);
  container.appendChild(chipWrap);
}

// ── Panel toggle ──────────────────────────────────────────────────────────────
function toggleChat() {
  isOpen = !isOpen;
  document.getElementById("chat-panel").classList.toggle("open", isOpen);
  document.getElementById("chat-launcher").classList.toggle("open", isOpen);
  if (isOpen) {
    setTimeout(() => document.getElementById("user-input").focus(), 300);
  }
}

// ── Messaging ─────────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 100) + "px";
}

function sendMessage() {
  const input = document.getElementById("user-input");
  const text  = input.value.trim();
  if (!text || isLoading) return;
  input.value = "";
  input.style.height = "auto";
  sendText(text);
}

async function sendText(text) {
  if (isLoading) return;

  appendMessage("user", text);
  setLoading(true);

  // Typing indicator
  const typingId = appendTyping();

  try {
    const res = await fetch(API_URL, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ message: text }),
    });

    removeTyping(typingId);

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      appendMessage("bot", err.error || "Something went wrong. Please try again.");
      return;
    }

    const data = await res.json();
    appendMessage("bot", data.answer || "I'm not sure — could you rephrase that?");

  } catch (err) {
    removeTyping(typingId);
    appendMessage("bot",
      "⚠️ Couldn't reach the server. Make sure the backend is running at: " + API_URL
    );
  } finally {
    setLoading(false);
  }
}

function appendMessage(role, text) {
  const container = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = `message ${role}`;

  const icon = document.createElement("div");
  icon.className = "msg-icon";
  icon.textContent = role === "bot" ? "🤖" : "🧑";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  wrap.appendChild(icon);
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function appendTyping() {
  const id = "typing-" + Date.now();
  const container = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.id = id;
  wrap.className = "message bot";
  wrap.innerHTML = `
    <div class="msg-icon">🤖</div>
    <div class="bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>`;
  container.appendChild(wrap);
  scrollToBottom();
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function setLoading(val) {
  isLoading = val;
  document.getElementById("send-btn").disabled = val;
  document.getElementById("user-input").disabled = val;
}

function scrollToBottom() {
  const c = document.getElementById("messages");
  c.scrollTop = c.scrollHeight;
}
</script>
</body>
</html>
